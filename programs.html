<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="stylesheet" href="style.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة البرامج | تحميل بلس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f1f5f9;
            --border: rgba(255, 255, 255, 0.1);
        }
        [data-theme="light"] {
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text: #1e293b;
            --border: rgba(0, 0, 0, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-top: 100px; transition: 0.4s; min-height: 100vh; }
        
        nav { position: fixed; top: 0; width: 100%; padding: 15px 5%; background: var(--card-bg); backdrop-filter: blur(20px); display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-bottom: 1px solid var(--border); }
        .back-btn { text-decoration: none; color: var(--text); font-weight: 800; display: flex; align-items: center; gap: 8px; }
        
        header { text-align: center; padding: 30px 20px; }
        header h1 span { background: linear-gradient(to left, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* ستايل الفلتر */
        .filter-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; padding: 0 15px; }
        .filter-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 20px; border-radius: 50px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3); }

        .programs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .soft-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 25px; transition: 0.4s; position: relative; overflow: hidden; }
        .soft-card:hover { transform: translateY(-10px); border-color: var(--primary); }
        
        .icon-box { width: 60px; height: 60px; background: rgba(0, 210, 255, 0.1); border-radius: 15px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; font-size: 1.8rem; color: var(--primary); }
        .meta-info { display: flex; justify-content: space-between; font-size: 0.75rem; border-top: 1px solid var(--border); padding-top: 15px; margin: 15px 0; }
        .dl-btn { background: linear-gradient(45deg, var(--secondary), var(--primary)); color: white; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 12px; font-weight: 800; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body data-theme="dark">

    <nav>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-right"></i> الرئيسية</a>
        <button onclick="toggleTheme()" style="background:none; border:none; cursor:pointer; font-size:1.2rem;">🌓</button>
    </nav>

    <header>
        <h1>مكتبة <span>البرامج</span></h1>
    </header>

    <div class="filter-container">
        <button class="filter-btn active" data-category="all">الكل</button>
        <button class="filter-btn" data-category="design">تصميم</button>
        <button class="filter-btn" data-category="video">مونتاج</button>
        <button class="filter-btn" data-category="tools">أدوات</button>
    </div>

    <div class="programs-grid">
        <div class="soft-card" data-category="design">
            <div class="icon-box"><i class="fab fa-adobe"></i></div>
            <h3>Photoshop 2024</h3>
            <p>تحرير وتصميم الصور باحترافية.</p>
            <div class="meta-info"><span>v25.1</span><span>4.2 GB</span></div>
            <a href="#" class="dl-btn">تحميل</a>
        </div>

        <div class="soft-card" data-category="video">
            <div class="icon-box"><i class="fas fa-video"></i></div>
            <h3>Premiere Pro</h3>
            <p>صناعة وتحرير الفيديو.</p>
            <div class="meta-info"><span>v24.0</span><span>8.5 GB</span></div>
            <a href="#" class="dl-btn">تحميل</a>
        </div>

        <div class="soft-card" data-category="tools">
            <div class="icon-box"><i class="fas fa-bolt"></i></div>
            <h3>IDM Full</h3>
            <p>تسريع تحميل الملفات.</p>
            <div class="meta-info"><span>v6.42</span><span>12 MB</span></div>
            <a href="#" class="dl-btn">تحميل</a>
        </div>
    </div>

    <script>
        // كود الفلترة
        const btns = document.querySelectorAll('.filter-btn');
        const cards = document.querySelectorAll('.soft-card');

        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const cat = btn.getAttribute('data-category');
                cards.forEach(card => {
                    if(cat === 'all' || card.getAttribute('data-category') === cat) {
                        card.style.display = 'block';
                        card.style.animation = 'fadeIn 0.4s ease forwards';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        }
    </script>
</body>
</html>
